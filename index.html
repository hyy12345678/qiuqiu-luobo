<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#57b34e" />
  <meta name="description" content="球球萝卜——保卫萝卜式 H5 塔防小游戏，五关冒险、六塔五怪、Boss 决战。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <title>球球萝卜</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥕</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #10141a;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body { display: flex; align-items: center; justify-content: center; }
    #stage { position: relative; }
    #game-canvas { display: block; width: 100%; height: 100%; }
    #ui-root { position: absolute; inset: 0; }

    /* ---- 通用按钮（尺寸全部用 em，随画面缩放） ---- */
    .btn {
      font-family: inherit;
      border: none;
      border-radius: 999px;
      background: linear-gradient(#ffc93c, #ff9f1c);
      color: #5b3208;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0.28em 0 #d97b06, 0 0.4em 0.6em rgba(0, 0, 0, 0.25);
      transition: transform 0.05s ease;
    }
    .btn:active { transform: translateY(0.18em); box-shadow: 0 0.1em 0 #d97b06; }

    /* ---- 主菜单（内容靠上，给画布里的角色小剧场留出下方空间） ---- */
    .menu {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center;
      padding-top: calc(2em + env(safe-area-inset-top));
      gap: 0.55em;
      color: #fff; text-align: center;
    }
    .menu h1 {
      font-size: 3.9em;
      letter-spacing: 0.1em;
      color: #fff;
      -webkit-text-stroke: 0.055em rgba(43,94,21,0.95);
      paint-order: stroke fill;
      text-shadow: 0 0.11em 0 rgba(30, 70, 15, 0.45), 0 0.22em 0.35em rgba(0, 0, 0, 0.25);
    }
    .menu p { font-size: 1.05em; opacity: 0.95; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45); }
    .btn-start { font-size: 1.75em; padding: 0.45em 2em; margin-top: 0.55em; }
    .menu .tip { font-size: 0.85em; opacity: 0.85; margin-top: 0.2em; }
    .menu-mute {
      position: absolute;
      top: calc(0.5em + env(safe-area-inset-top));
      right: calc(0.6em + env(safe-area-inset-right));
    }

    /* ---- 选关卡片 ---- */
    .lv-row { display: flex; gap: 0.75em; margin-top: 0.9em; flex-wrap: wrap; justify-content: center; }
    .lv-card {
      font-family: inherit;
      width: 4.8em; height: 5.4em;
      border-radius: 0.9em;
      background: #fff8ec;
      border: 0.2em solid #a9743f;
      box-shadow: 0 0.3em 0 #8a5c33, 0 0.45em 0.8em rgba(0, 0, 0, 0.25);
      color: #5b3208;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.12em;
      cursor: pointer;
      transition: transform 0.06s ease;
    }
    .lv-card:active:not(:disabled) { transform: translateY(0.14em); box-shadow: 0 0.12em 0 #8a5c33; }
    .lv-card .num { font-size: 1.65em; font-weight: 800; line-height: 1; }
    .lv-card .nm { font-size: 0.62em; font-weight: 700; opacity: 0.85; white-space: nowrap; }
    .lv-card .st { font-size: 0.6em; letter-spacing: -0.08em; white-space: nowrap; }
    .lv-card:disabled {
      filter: grayscale(0.95);
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ---- 战斗 HUD（刘海屏安全区适配） ---- */
    .hud {
      position: absolute;
      top: calc(0.5em + env(safe-area-inset-top));
      left: calc(0.7em + env(safe-area-inset-left));
      right: calc(0.7em + env(safe-area-inset-right));
      display: flex; align-items: center; gap: 0.5em;
      color: #fff; pointer-events: none;
    }
    .hud .spacer { flex: 1; }
    .chip {
      background: rgba(30, 22, 10, 0.62);
      border: 2px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 0.3em 0.85em;
      font-size: 1.05em; font-weight: 700;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }
    .chip-tip { font-size: 0.9em; opacity: 0.95; animation: tip-blink 1.6s ease-in-out infinite; }
    @keyframes tip-blink { 50% { opacity: 0.55; } }
    .btn-back { font-size: 1em; padding: 0.35em 1.1em; pointer-events: auto; }
    .btn-icon { font-size: 1em; padding: 0.32em 0.85em; pointer-events: auto; }
    /* 波间倒计时时可点击提前召唤 */
    .chip.call-ready {
      pointer-events: auto;
      cursor: pointer;
      border-color: rgba(255, 213, 79, 0.8);
      animation: call-pulse 1s ease-in-out infinite;
    }
    @keyframes call-pulse {
      50% { background: rgba(90, 66, 20, 0.75); transform: translateY(-1px); }
    }

    /* ---- 建造栏 ---- */
    .build-bar {
      position: absolute; left: 50%;
      bottom: calc(1em + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex; gap: 0.6em; align-items: center;
      background: rgba(30, 22, 10, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 0.5em 0.8em;
      pointer-events: auto;
    }
    .build-bar[hidden] { display: none; }
    .build-bar .btn { font-size: 1.05em; padding: 0.4em 1.2em; }

    /* ---- 结算面板 ---- */
    .overlay {
      position: absolute; inset: 0; z-index: 10;
      background: rgba(12, 18, 8, 0.55);
      display: flex; align-items: center; justify-content: center;
      pointer-events: auto;
    }
    .panel {
      background: #fff8ec;
      border: 0.32em solid #a9743f;
      border-radius: 1.2em;
      box-shadow: 0 0.5em 1.6em rgba(0, 0, 0, 0.4);
      padding: 1.1em 2em 1.4em;
      display: flex; flex-direction: column; align-items: center; gap: 0.55em;
      color: #5b3208; min-width: 17em;
    }
    .panel h2 { font-size: 1.9em; }
    .panel .stars { font-size: 1.9em; letter-spacing: 0.08em; }
    .panel .sub { opacity: 0.85; font-size: 1em; }
    .panel .row { display: flex; gap: 0.7em; margin-top: 0.4em; }
    .panel .row .btn { font-size: 1.05em; padding: 0.42em 1.25em; }

    /* ---- 按钮变体 ---- */
    .btn-cancel {
      background: linear-gradient(#cfd8dc, #90a4ae);
      color: #263238;
      box-shadow: 0 0.28em 0 #607d8b, 0 0.4em 0.6em rgba(0, 0, 0, 0.25);
    }
    .btn-cancel:active { transform: translateY(0.18em); box-shadow: 0 0.1em 0 #607d8b; }
    .btn-green {
      background: linear-gradient(#8bd45c, #57a83b);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      box-shadow: 0 0.28em 0 #3f7d29, 0 0.4em 0.6em rgba(0, 0, 0, 0.25);
    }
    .btn-green:active { transform: translateY(0.18em); box-shadow: 0 0.1em 0 #3f7d29; }
    .btn:disabled {
      filter: grayscale(0.75) brightness(0.82);
      cursor: not-allowed;
      transform: none !important;
    }

    /* ---- 竖屏提示：本作为横屏设计 ---- */
    #rotate-hint {
      display: none;
      position: fixed; inset: 0; z-index: 99;
      background: #14181f; color: #fff;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; font-size: 20px;
    }
    #rotate-hint .icon { font-size: 56px; animation: spin 2s ease-in-out infinite alternate; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(90deg); } }
    @media (orientation: portrait) { #rotate-hint { display: flex; } }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
  </div>
  <div id="rotate-hint">
    <div class="icon">📱</div>
    <div>球球萝卜是横屏游戏<br />请旋转手机游玩</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
